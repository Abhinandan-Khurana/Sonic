[workspace]
members = ["bridge", "vendor/soulseek-rs-lib"]
resolver = "2"

[workspace.package]
version = "19.1.0"
authors = ["Michel de Graaf", "Runout contributors"]
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/michel/soulseek-rs"
homepage = "https://re-invention.nl/soulseek-rs/"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
strip = true
lto = "thin"
