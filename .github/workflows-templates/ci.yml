name: Android and Soulseek
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install native and Android prerequisites
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.3.13750724'
      - name: Test the native core and adapter against local fixtures
        run: cargo +1.91.0 test --manifest-path native/Cargo.toml --workspace --lib --locked
      - name: Build all native ABIs, verify Android tests and lint, and package APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runout-build-and-reports
          path: |
            app/build/outputs/apk/
            app/build/reports/
