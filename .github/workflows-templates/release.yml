name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Rename & Checksum APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Runout-${{ github.ref_name }}.apk
          cd dist
          shasum -a 256 Runout-${{ github.ref_name }}.apk > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Runout-${{ github.ref_name }}.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
