steps:
  - launch: app.runout.dev
  - when: { visible: { id: setup-offline } }
    steps:
      - tap: { id: setup-offline }
      - tap: { id: setup-finish }
  - await: { visible: { id: turntable } }
  - scroll-to: { target: { id: 'nav:DIG' } }
  - tap: { id: 'nav:DIG' }
  - await: { visible: { id: 'screen:search' } }
  - tap: { id: 'action:Close' }
  - scroll-to: { target: { id: 'nav:FRIENDS' } }
  - tap: { id: 'nav:FRIENDS' }
  - await: { visible: { id: 'panel:messages' } }
  - tap: { id: 'action:Close' }
  - scroll-to: { target: { id: 'nav:SETTINGS' } }
  - tap: { id: 'nav:SETTINGS' }
  - await: { visible: { id: 'panel:sound' } }
  - tap: { id: 'action:Close' }
  - tap: { id: open-downloads }
  - await: { visible: { id: 'panel:transfers' } }
  - tap: { id: 'action:Close' }
  - await: { visible: { id: turntable } }
