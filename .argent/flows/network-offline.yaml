executionPrerequisite: Runout is connected on its main screen, then both Wi-Fi and mobile data have deliberately been disabled on this test emulator. Restore both even if the flow fails.
steps:
  - await: { visible: { text: Reconnecting }, timeout: 15000 }
  - tap: { id: open-account }
  - await: { visible: { id: account-connection } }
  - await: { visible: { text: Sign out } }
  - await: { idle: true, stableFor: 6500, timeout: 10000 }
  - await: { visible: { text: Sign out } }
